<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datos de pago | FRAME Festival</title>
  <meta name="description" content="Introduce tus datos de pago para finalizar la compra de entradas de FRAME Festival.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-link" href="index.html" aria-label="FRAME inicio">
        <img src="img/FRAME.logo.svg" alt="FRAME">
        <span class="brand-mark" aria-hidden="true">F</span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="peliculas.html">Películas</a>
        <a href="contacto.html">Contacto</a>
        <a class="is-active" href="compra.html">Entradas</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button" type="button" data-search-toggle aria-expanded="false" aria-label="Buscar"><i class="bi bi-search"></i></button>
        <button class="icon-button menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </header>

  <nav class="mobile-menu" data-mobile-menu aria-label="Menú móvil">
    <a href="index.html">Inicio</a>
    <a href="peliculas.html">Películas</a>
    <a href="contacto.html">Contacto</a>
    <a href="compra.html">Entradas</a>
  </nav>

  <section class="search-panel" data-search-panel>
    <div class="container-page">
      <div class="search-box">
        <input type="search" data-search-input placeholder="Buscar películas, entradas o contacto..." aria-label="Buscar en FRAME">
        <button class="btn-frame btn-primary-frame" type="button" data-search-toggle>Cerrar</button>
      </div>
      <div class="search-results" data-search-results></div>
    </div>
  </section>

  <main class="form-shell">
    <section class="checkout-card">
      <p class="eyebrow">Pago seguro</p>
      <h1 class="panel-title">Datos de pago</h1>
      <div class="summary-box" data-order-summary></div>

      <form id="paymentForm" novalidate>
        <div class="form-group-frame">
          <label for="nombre">Titular de la tarjeta</label>
          <input class="form-control-frame" type="text" id="nombre" name="nombre" autocomplete="cc-name" placeholder="Nombre y apellidos">
          <small class="error-message" data-error="nombre"></small>
        </div>

        <div class="form-group-frame">
          <label for="tarjeta">Número de tarjeta</label>
          <input class="form-control-frame" type="text" id="tarjeta" name="tarjeta" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="4242 4242 4242 4242">
          <small class="error-message" data-error="tarjeta"></small>
        </div>

        <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group-frame">
            <label for="fecha">Caducidad</label>
            <input class="form-control-frame" type="text" id="fecha" name="fecha" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA">
            <small class="error-message" data-error="fecha"></small>
          </div>

          <div class="form-group-frame">
            <label for="cvv">CVV</label>
            <input class="form-control-frame" type="text" id="cvv" name="cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123">
            <small class="error-message" data-error="cvv"></small>
          </div>
        </div>

        <div id="spinner" class="d-none text-center mb-3">
          <i class="bi bi-hourglass-split"></i> Validando pago...
        </div>

        <button class="btn-frame btn-primary-frame w-100" type="submit">Pagar ahora</button>
        <a class="btn-frame btn-secondary-frame w-100 mt-2" href="compra.html">Modificar entradas</a>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container-page footer-grid">
      <div>
        <h2 class="footer-title">FRAME</h2>
        <p>Privacidad · Términos y condiciones</p>
        <div class="footer-contact">
          <a href="mailto:framefestival@contact.com">framefestival@contact.com</a>
          <span>951 967 735 · P.º Reding, 22, Málaga</span>
        </div>
      </div>
      <div class="social-links" aria-label="Redes sociales">
        <a href="contacto.html" aria-label="Twitter"><i class="bi bi-twitter"></i></a>
        <a href="contacto.html" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="contacto.html" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
